apiVersion: v1
kind: Secret
metadata:
  name: shop-db-secret
  namespace: shopx
type: Opaque
stringData:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: authdb
  DB_USER: authuser
  DB_PASSWORD: StrongPassword@123
  JWT_SECRET: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC12ZXJ5LWxvbmctc2VjcmV0LWtleS1mb3ItbG9jYWxzaG9weC1qd3Qtc2lnbmluZy1wcm9kdWN0aW9uLXJlYWR5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shopx
  labels:
    app: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
      annotations:
        sidecar.istio.io/proxyCPU: "10m"
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemory: "64Mi"
        sidecar.istio.io/proxyMemoryLimit: "256Mi"
    spec:
      containers:
      - name: shop
        image: varunsoam/shopx-shop:401
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8082

        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: shop-db-secret
              key: DB_HOST

        - name: NOTIFICATION_SERVICE_URL
          value: http://notification:8088

        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: shop-db-secret
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: shop-db-secret
              key: DB_NAME

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: shop-db-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shop-db-secret
              key: DB_PASSWORD

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: shop-db-secret
              key: JWT_SECRET

        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update

        # ---- OpenTelemetry Configuration ----
        - name: OTEL_SERVICE_NAME
          value: "shop-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=shopx,deployment.environment=testing"

        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        startupProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: shopx
  labels:
    app: shop
spec:
  type: ClusterIP
  selector:
    app: shop
  ports:
    - name: http
      port: 8082
      targetPort: http
