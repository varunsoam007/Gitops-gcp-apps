apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopx-gateway
  namespace: shopx
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: jksoa-ingress-ip
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
