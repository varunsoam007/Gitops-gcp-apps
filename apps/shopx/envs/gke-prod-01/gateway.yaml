apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopx-gateway
  namespace: shopx
  annotations:
    networking.gke.io/cert-map: shopx-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: jksoa-ingress-ip
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: shopx-tls
