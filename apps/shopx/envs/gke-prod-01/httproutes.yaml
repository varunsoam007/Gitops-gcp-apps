apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: shopx
spec:
  parentRefs:
    - name: shopx-gateway
      namespace: shopx
    - name: shared-gateway-int
      namespace: gateway-api
  hostnames:
    - "shop.jksoam.in"
    - "shopx.jksoam.in"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80

